name: Build SEO Media

on:
  push:
    branches:
      - seo/full-onpage-pass-20260922
    paths:
      - '.github/workflows/build-seo-media.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/full-onpage-pass-20260922
      - name: Build PNG social card and inspect image dimensions
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg

          cairosvg.svg2png(
              url="og-image.svg",
              write_to="og-image.png",
              output_width=1200,
              output_height=630,
          )

          print("OG_PNG:", Image.open("og-image.png").size, Path("og-image.png").stat().st_size)

          for path in [
              "assets/web/psoydo-negative.webp",
              "assets/web/psoydo.webp",
              "assets/web/wescaleit.webp",
              "assets/web/wescaleit-negative.webp",
              "assets/web/sichtabgleich.webp",
              "assets/web/revision.webp",
              "assets/web/download.webp",
          ]:
              with Image.open(path) as im:
                  print("DIM:", path, im.width, im.height)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          if git diff --cached --quiet; then
            echo "No SEO media changes"
          else
            git commit -m "Add PNG social preview"
            git push origin HEAD:seo/full-onpage-pass-20260922
          fi
