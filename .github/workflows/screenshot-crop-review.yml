name: Screenshot Crop Review

on:
  push:
    branches:
      - fix/crop-and-home-gallery
    paths:
      - '.github/workflows/screenshot-crop-review.yml'

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crop-and-home-gallery
      - name: Detect and crop top black bars
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          jobs=[
            ("assets/Psoydo Screenshots/Bildschirmfoto 2026-09-21 um 07.02.18.png","assets/web/sichtabgleich.webp"),
            ("assets/Psoydo Screenshots/Bildschirmfoto 2026-09-21 um 07.01.37.png","assets/web/revision.webp"),
            ("assets/Psoydo Screenshots/Bildschirmfoto 2026-09-21 um 07.07.22.png","assets/web/download.webp"),
          ]

          def row_luma(im,y):
              row=im.crop((0,y,im.width,y+1)).convert("RGB")
              stat=ImageStat.Stat(row)
              return sum(stat.mean)/3

          for src,dst in jobs:
              with Image.open(src) as raw:
                  im=raw.convert("RGB")
                  values=[row_luma(im,y) for y in range(min(120,im.height))]
                  print("\nFILE:",Path(src).name,"SIZE:",im.size)
                  print("ROW_LUMA_0_40:", [round(v,1) for v in values[:40]])

                  crop=0
                  # Find first sustained transition from very dark top chrome to page content.
                  seen_dark=False
                  for y in range(0,len(values)-6):
                      if values[y] < 55:
                          seen_dark=True
                      if seen_dark and all(v > 70 for v in values[y:y+6]):
                          crop=y
                          break

                  if crop < 2 or crop > 80:
                      print("AUTO_CROP_UNRELIABLE:",crop)
                      crop=0
                  print("CROP_TOP:",crop)

                  cropped=im.crop((0,crop,im.width,im.height))
                  maxw=1800
                  if cropped.width>maxw:
                      h=round(cropped.height*maxw/cropped.width)
                      cropped=cropped.resize((maxw,h),Image.Resampling.LANCZOS)
                  Path(dst).parent.mkdir(parents=True,exist_ok=True)
                  cropped.save(dst,"WEBP",quality=82,method=6)
                  print("SAVED:",dst,cropped.size,Path(dst).stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/web
          if git diff --cached --quiet; then
            echo "No crop changes"
          else
            git commit -m "Crop black top bars from product screenshots"
            git push origin HEAD:fix/crop-and-home-gallery
          fi
