<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Seite nicht gefunden — Psoydo</title>
  <meta name="theme-color" content="#071d22">
  <script>
    // A custom 404 keeps the requested URL, including nested directories.
    var project = location.hostname.endsWith('.github.io')
      ? location.pathname.split('/').filter(Boolean)[0] : '';
    var siteRoot = location.origin + (project ? '/' + project + '/' : '/');
    // Create URLs before requesting assets; speculative loading must not use
    // the missing page's directory.
    ['styles.css?v=20260922-colors2', 'v3.css?v=20260922-colors2', 'favicon.svg'].forEach(function (asset) {
      var link = document.createElement('link');
      link.rel = asset.split('?')[0].endsWith('.css') ? 'stylesheet' : 'icon';
      link.href = siteRoot + asset;
      document.head.appendChild(link);
    });
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('[data-home]').forEach(function (link) {
        link.href = siteRoot + 'de/';
      });
      document.querySelector('[data-logo]').src = siteRoot + 'assets/web/psoydo-negative.webp';
    });
  </script>
  <noscript>
    <link rel="stylesheet" href="https://psoydo.com/styles.css">
    <link rel="stylesheet" href="https://psoydo.com/v3.css?v=20260922-colors2">
  </noscript>
  <style>
    body{background:#071d22;color:#fff}
    .error-shell{min-height:100svh;display:grid;place-items:center;padding:40px}
    .error-card{width:min(1080px,100%);border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);padding:70px 0;display:grid;grid-template-columns:220px 1fr;gap:70px}
    .error-code{font:500 11px var(--mono);letter-spacing:.12em;color:#667970}
    .error-card h1{font-size:clamp(58px,8vw,118px);line-height:.88;letter-spacing:-.075em;margin:0}
    .error-card h1 span{color:#5df5b8}
    .error-card p{max-width:620px;color:#84948c;font-size:16px;line-height:1.7;margin:32px 0}
    .error-logo{position:fixed;top:34px;left:40px}
    .error-logo img{display:block;width:145px;height:auto}
    @media(max-width:760px){.error-shell{padding:28px}.error-card{grid-template-columns:1fr;gap:24px}.error-logo{left:28px;top:26px}.error-card h1{font-size:58px}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt</a>
  <a class="error-logo" data-home href="https://psoydo.com/de/" aria-label="Psoydo Startseite"><img data-logo width="700" height="180" alt="Psoydo AI"><noscript>Psoydo AI</noscript></a>
  <main id="main" class="error-shell" tabindex="-1">
    <section class="error-card">
      <span class="error-code">ERROR / 404</span>
      <div>
        <h1>Hier ist<br><span>nichts zu schützen.</span></h1>
        <p>Die gesuchte Seite existiert nicht oder wurde verschoben. Zurück zur Psoydo Startseite und von dort weiter.</p>
        <a class="button button-primary" data-home href="https://psoydo.com/de/">Zur Startseite <span>↗</span></a>
      </div>
    </section>
  </main>
</body>
</html>
